[project]
name = "tmi-tf"
version = "0.1.0"
description = "Terraform infrastructure analysis tool for TMI threat models"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.50",
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    # TMI client dependencies
    "certifi>=2024.2.2",
    "six>=1.16.0",
    "python-dateutil>=2.9.0",
    "setuptools>=82.0.0",
    "urllib3>=2.7.0",
    # litellm 1.98.0+ imports typing.NotRequired (3.11+) at module import time
    # while still declaring requires-python >=3.10, so it fails on the 3.10 CI
    # leg. Lift the cap once litellm fixes the import or this project drops 3.10.
    "litellm>=1.84.0,<1.98",
    "nh3>=0.3.3",
    "cvss>=3.2",
    "oci>=2.168.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
tmi-tf = "tmi_tf.cli:cli"

[tool.uv]
# Keep this list to overrides that buy something a caller cannot get otherwise.
# An override is a standing exception: it silences the upstream constraint for
# every future resolution, so each dependency bump has to re-establish that the
# capped package still tolerates the forced version. That review cost is worth
# paying to clear an advisory; it is not worth paying for currency alone -- see
# issue #40, where an importlib-metadata>=9.0.0 override was tried and backed
# out for exactly that reason, and issue #39, where a cryptography>=50 override
# cleared CVE-2026-69247 and was dropped once oci relaxed its cap.
override-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.1",
    "pyright>=1.1.407",
    # starlette.testclient (which fastapi.testclient re-exports) imports
    # `httpx2` and only falls back to httpx -- with a StarletteDeprecationWarning
    # -- when it is absent. Nothing here uses httpx directly; it arrives as a
    # transitive dependency of litellm and huggingface-hub, and stays. This
    # entry is only so TestClient takes the supported path.
    "httpx2>=2.0.0",
]

[tool.ruff]
# CI checks out the generated TMI client into ./tmi-clients (GitHub Actions
# cannot place a checkout above the workspace). It is vendored third-party
# generated code, not this project's source, and must never be linted,
# type-checked, or collected as tests -- see the matching pyright exclude and
# pytest testpaths below. The same applies to any local clone placed here.
extend-exclude = ["tmi-clients"]

[tool.ruff.lint]
# Ruff's default rule set is a curated subset of each family, and 0.16 widened
# it -- which is how a routine dependency bump surfaced ~400 findings here. We
# track those defaults deliberately rather than pinning a narrow `select`.
#
# Pinning by family prefix was considered and rejected: `select = ["D", "S",
# ...]` selects each family *whole*, which reports 2053 findings in this repo
# (E501 line length, D1xx docstring mandates, TRY003, PLR2004 magic values --
# conventions this codebase has never followed). Re-check the delta whenever
# ruff's minor version moves; `ruff check --statistics` shows it quickly.
ignore = [
    # tmi-tf is a pipeline over third-party Terraform repos and remote LLM/TMI
    # API calls. Each stage catches broadly on purpose so one bad repo, model
    # response, or network blip degrades that stage (log and continue, or
    # return None) instead of killing a multi-repo run; CLI entrypoints catch
    # to exit with a message rather than a traceback. All 37 sites follow that
    # pattern, so BLE001 reports the architecture rather than any defect.
    # The handlers that swallowed *silently* were fixed, not ignored.
    "BLE001",
]

[tool.pytest.ini_options]
# Only ever collect this project's tests. Without this, a vendored client
# checkout under ./tmi-clients (as CI creates) contributes its own generated
# test modules to the run.
testpaths = ["tests"]

[tool.pyright]
# tmi_client is added to sys.path at runtime from ~/Projects/tmi-clients/
# and cannot be resolved statically; imports are suppressed per-line
exclude = ["**/.venv", "tmi-clients"]
