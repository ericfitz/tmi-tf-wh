defaults:
  unknown_category: other
  unknown_attrs: all
  # Script-carrying attribute names (matched at any nesting depth). Their value
  # is replaced by "[script omitted: sha256:<12 hex>, <N> chars]" everywhere.
  hash_only_attrs:
    - user_data
    - user_data_base64
    - custom_data
    - metadata_startup_script
    - startup-script
    - startup_script
    - cloud_init
    - cloud-init
  # Too generic to hash everywhere (e.g. local_file.content), so these apply
  # only to `data` blocks, unioned with hash_only_attrs above.
  data_hash_only_attrs:
    - template
    - content
