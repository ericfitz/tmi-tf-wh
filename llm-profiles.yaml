# Named LLM profiles. Select one per invocation with user_data
# {"profile": "<name>"}, per CLI run with --profile, or by default with
# LLM_PROFILE. api_key names the env var / secret holding the key, never the
# key itself. Fields and rules: docs/superpowers/specs/2026-09-22-llm-profiles-design.md
# ANTHROPIC_CVP_API_KEY: reduced guardrails, no Mythos access.
# OPENAI_API_KEY: standard key, no cyber-model access.
profiles:
  fable51:
    provider: anthropic
    model: claude-fable-5-1
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  fable5:
    provider: anthropic
    model: claude-fable-5
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  opus48:
    provider: anthropic
    model: claude-opus-4-8
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  opus55:
    provider: anthropic
    model: claude-opus-5-5
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  opus5:
    provider: anthropic
    model: claude-opus-5
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  sonnet5:
    provider: anthropic
    model: claude-sonnet-5
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  # gpt-6 models reject max_tokens on chat completions; responses works.
  gpt6astra:
    provider: openai
    model: gpt-6-astra
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt6sol:
    provider: openai
    model: gpt-6-sol
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt56terra:
    provider: openai
    model: gpt-5.6-terra
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt6luna:
    provider: openai
    model: gpt-6-luna
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
