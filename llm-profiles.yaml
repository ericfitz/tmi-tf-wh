# Named LLM profiles. Select one per invocation with user_data
# {"profile": "<name>"}, per CLI run with --profile, or by default with
# LLM_PROFILE. api_key names the env var / secret holding the key, never the
# key itself. Fields and rules: docs/superpowers/specs/2026-09-22-llm-profiles-design.md
# Name each profile after its model with '.' replaced by '_' (ADR 0004).
# After adding or removing one, re-run scripts/addon-profile-param.py.
# ANTHROPIC_CVP_API_KEY: filled from the cyber key; used only for Mythos (ADR 0006).
# ANTHROPIC_API_KEY: standard key, no Mythos access; every other Anthropic profile.
# OPENAI_API_KEY: standard key, no cyber-model access.
profiles:
  claude-mythos-5-2:
    provider: anthropic
    model: claude-mythos-5-2
    auth: api_key
    api_key: ANTHROPIC_CVP_API_KEY
  claude-fable-5-2:
    provider: anthropic
    model: claude-fable-5-2
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-fable-5-1:
    provider: anthropic
    model: claude-fable-5-1
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-fable-5:
    provider: anthropic
    model: claude-fable-5
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-opus-4-8:
    provider: anthropic
    model: claude-opus-4-8
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-opus-5:
    provider: anthropic
    model: claude-opus-5
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  claude-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    auth: api_key
    api_key: ANTHROPIC_API_KEY
  # gpt-6 models reject max_tokens on chat completions; responses works.
  gpt-6_2-astra:
    provider: openai
    model: gpt-6.2-astra
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6_2-sol:
    provider: openai
    model: gpt-6.2-sol
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6_1-sol:
    provider: openai
    model: gpt-6.1-sol
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6_1-terra:
    provider: openai
    model: gpt-6.1-terra
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6-astra:
    provider: openai
    model: gpt-6-astra
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6-sol:
    provider: openai
    model: gpt-6-sol
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-5_6-terra:
    provider: openai
    model: gpt-5.6-terra
    auth: api_key
    api_key: OPENAI_API_KEY
  gpt-6-luna:
    provider: openai
    model: gpt-6-luna
    api: responses
    auth: api_key
    api_key: OPENAI_API_KEY
